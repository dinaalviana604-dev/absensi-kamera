<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Selfie SMKN 1 Tirtajaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-md w-full bg-white rounded-xl shadow-md overflow-hidden p-6 mb-6">
    <h2 class="text-xl font-bold text-center text-blue-700 mb-4">Absensi Siswa SMKN 1 Tirtajaya</h2>
    
    <form id="formAbsensi" onsubmit="kirimAbsensi(event)">
      <!-- Pilih Kelas -->
      <label class="block mb-2 font-medium">Kelas & Jurusan:</label>
      <select id="kelas" class="w-full border rounded p-2 mb-4" required>
        <option value="">-- Pilih Kelas --</option>
        <optgroup label="Kelas 10">
          <option value="X TM 1">X TM 1</option><option value="X TM 2">X TM 2</option>
          <option value="X TO 1">X TO 1</option><option value="X TO 2">X TO 2</option>
          <option value="X TO 3">X TO 3</option><option value="X TO 4">X TO 4</option>
          <option value="X PPLG 1">X PPLG 1</option><option value="X PPLG 2">X PPLG 2</option>
          <option value="X TJKT 1">X TJKT 1</option><option value="X TJKT 2">X TJKT 2</option>
        </optgroup>
        <optgroup label="Kelas 11">
          <option value="XI TM 1">XI TM 1</option><option value="XI TM 2">XI TM 2</option>
          <option value="XI TO 1">XI TO 1</option><option value="XI TO 2">XI TO 2</option>
          <option value="XI TO 3">XI TO 3</option><option value="XI TO 4">XI TO 4</option>
          <option value="XI PPLG 1">XI PPLG 1</option><option value="XI PPLG 2">XI PPLG 2</option>
          <option value="XI TJKT 1">XI TJKT 1</option><option value="XI TJKT 2">XI TJKT 2</option>
        </optgroup>
        <optgroup label="Kelas 12">
          <option value="XII TM 1">XII TM 1</option><option value="XII TM 2">XII TM 2</option>
          <option value="XII TO 1">XII TO 1</option><option value="XII TO 2">XII TO 2</option>
          <option value="XII TO 3">XII TO 3</option><option value="XII TO 4">XII TO 4</option>
          <option value="XII PPLG 1">XII PPLG 1</option><option value="XII PPLG 2">XII PPLG 2</option>
          <option value="XII TJKT 1">XII TJKT 1</option><option value="XII TJKT 2">XII TJKT 2</option>
        </optgroup>
      </select>

      <!-- NIS & Nama -->
      <label class="block mb-2 font-medium">NIS / NISN:</label>
      <input type="number" id="nis" class="w-full border rounded p-2 mb-4" placeholder="Masukkan NIS" required>

      <label class="block mb-2 font-medium">Nama Siswa:</label>
      <input type="text" id="nama" class="w-full border rounded p-2 mb-4" placeholder="Masukkan Nama Lengkap" required>

      <!-- Kamera Selfie -->
      <label class="block mb-2 font-medium">Foto Selfie:</label>
      <div class="mb-4 flex flex-col items-center">
        <video id="video" width="100%" height="auto" autoplay playsinline class="rounded border mb-2 bg-black"></video>
        <button type="button" onclick="ambilFoto()" class="bg-gray-800 text-white px-4 py-2 rounded text-sm w-full mb-2 hover:bg-gray-700">
          Ambil Foto Selfie
        </button>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="previewFoto" alt="Pratinjau Foto" class="rounded border mt-2 hidden max-h-48">
      </div>

      <!-- Status -->
      <label class="block mb-2 font-medium">Status Kehadiran:</label>
      <select id="status" class="w-full border rounded p-2 mb-4" required>
        <option value="Hadir">Hadir</option>
        <option value="Sakit">Sakit</option>
        <option value="Izin">Izin</option>
      </select>

      <!-- Tombol Kirim -->
      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">
        Kirim Presensi
      </button>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdANJvyBSDrebpQaOP8F1Y4_aQYEkluTHYJTFynsez9Q7jEKQ1YUvqGYCjuW13gnE_KQ/exec";
    let fotoBase64 = "";

    window.addEventListener("load", () => {
      const video = document.getElementById("video");
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(stream => {
          video.srcObject = stream;
        })
        .catch(err => {
          console.warn("Kamera tidak dapat diakses langsung: " + err);
        });
    });

    function ambilFoto() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const preview = document.getElementById("previewFoto");

      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      fotoBase64 = canvas.toDataURL("image/jpeg");
      preview.src = fotoBase64;
      preview.classList.remove("hidden");
      alert("Foto selfie berhasil diambil!");
    }

    function kirimAbsensi(event) {
      event.preventDefault();
      
      if (!fotoBase64) {
        alert("Harap ambil foto selfie terlebih dahulu sebelum mengirim presensi!");
        return;
      }

      const btn = document.getElementById("btnSubmit");
      btn.innerText = "Mengirim...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          const payload = {
            nis: document.getElementById("nis").value,
            nama: document.getElementById("nama").value,
            kelas: document.getElementById("kelas").value,
            status: document.getElementById("status").value,
            koordinat: `${lat}, ${lng}`,
            foto: fotoBase64
          };

          fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
            alert(data.message || "Presensi Berhasil Disimpan!");
            document.getElementById("formAbsensi").reset();
            document.getElementById("previewFoto").classList.add("hidden");
            fotoBase64 = "";
          })
          .catch(err => {
            alert("Gagal mengirim presensi: " + err);
          })
          .finally(() => {
            btn.innerText = "Kirim Presensi";
            btn.disabled = false;
          });
        },
        (error) => {
          alert("Gagal mengambil GPS. Pastikan izin lokasi aktif di browser Anda.");
          btn.innerText = "Kirim Presensi";
          btn.disabled = false;
        }
      );
    }
  </script>
</body>
</html>
